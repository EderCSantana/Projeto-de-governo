<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto de Governo</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #5d6778; --line: #e3e7ee;
    --accent: #1f5fbf; --accent-soft: #e8f0fc; --accent-ink: #164a96;
    --exec: #1f5fbf; --leg: #7a3fb8;
    --proposta: #5d6778; --proposta-bg: #eef0f4;
    --discussao: #9a6200; --discussao-bg: #fdf3dc;
    --aprovada: #1f7a3d; --aprovada-bg: #e3f5e9;
    --descartada: #a8323a; --descartada-bg: #fbe7e8;
    --radius: 12px; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 2px 8px rgba(20,30,50,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --card: #1a2029; --ink: #e6e9ef; --muted: #9aa4b5; --line: #2a323e;
      --accent: #6aa1ff; --accent-soft: #1d2a40; --accent-ink: #9cc0ff;
      --exec: #6aa1ff; --leg: #b78cf0;
      --proposta: #aab3c2; --proposta-bg: #262d38;
      --discussao: #f0bf5a; --discussao-bg: #3a2f17;
      --aprovada: #6fd18f; --aprovada-bg: #183323;
      --descartada: #f08a90; --descartada-bg: #3a1c1f;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font: .9em ui-monospace, "Cascadia Code", Consolas, monospace;
    background: var(--proposta-bg); padding: .1em .35em; border-radius: 4px; }
  pre { background: var(--proposta-bg); padding: 14px 16px; border-radius: 8px; overflow: auto; }
  pre code { background: none; padding: 0; }

  header.topo { position: sticky; top: 0; z-index: 10; background: var(--card);
    border-bottom: 1px solid var(--line); }
  .topo .in { max-width: 1180px; margin: 0 auto; padding: 0 20px; display: flex;
    align-items: center; gap: 24px; height: 60px; }
  .marca { font-weight: 700; font-size: 18px; color: var(--ink); display: flex; gap: 10px; align-items: center; }
  .marca:hover { text-decoration: none; }
  .marca .selo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    color: #fff; display: grid; place-items: center; font-size: 15px; }
  nav.menu { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.menu a { color: var(--muted); padding: 7px 12px; border-radius: 8px; font-size: 15px; }
  nav.menu a:hover { background: var(--bg); text-decoration: none; color: var(--ink); }
  nav.menu a.ativo { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .busca-topo { margin-left: auto; }
  .busca-topo input { width: 230px; }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 21px; margin: 34px 0 14px; }
  h3 { font-size: 17px; margin: 0; }
  .sub { color: var(--muted); margin: 0 0 22px; max-width: 760px; }
  .trilha { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .trilha a { color: var(--muted); }
  .trilha span { margin: 0 6px; }

  input[type=search], select { font: inherit; font-size: 15px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .hero { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 30px 32px; box-shadow: var(--shadow); margin-bottom: 26px; }
  .hero p { color: var(--muted); max-width: 780px; margin: 0; }
  .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 24px; }
  .numero { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; }
  .numero b { display: block; font-size: 28px; line-height: 1.1; }
  .numero span { color: var(--muted); font-size: 14px; }

  .grade { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .cartao { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); color: var(--ink); display: block; }
  a.cartao:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-1px); }
  a.cartao { transition: border-color .15s, transform .15s; }
  .cartao .rot { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .cartao p { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .cartao .rodape { display: flex; gap: 16px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .cartao .rodape b { color: var(--ink); }
  .cartao.vazio { opacity: .72; }
  .cartao.vazio:hover { opacity: 1; }

  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px;
    border-radius: 99px; background: var(--proposta-bg); color: var(--muted); white-space: nowrap; }
  .tag.executivo { background: var(--accent-soft); color: var(--exec); }
  .tag.legislativo { background: color-mix(in srgb, var(--leg) 14%, transparent); color: var(--leg); }
  .sit-proposta { background: var(--proposta-bg); color: var(--proposta); }
  .sit-em-discussao { background: var(--discussao-bg); color: var(--discussao); }
  .sit-aprovada { background: var(--aprovada-bg); color: var(--aprovada); }
  .sit-descartada { background: var(--descartada-bg); color: var(--descartada); }

  .barras { display: flex; gap: 4px; margin-top: 12px; }
  .barras i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .barras i.tem { background: var(--accent); }

  .aviso { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 14px 18px;
    border-radius: 8px; margin: 0 0 16px; max-width: 900px; }
  .aviso.leg { background: color-mix(in srgb, var(--leg) 10%, transparent); border-color: var(--leg); }
  .aviso p { margin: 0; }
  .aviso p + p { margin-top: 8px; }

  .prazos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 960px) { .prazos { grid-template-columns: 1fr; } }
  .coluna { background: color-mix(in srgb, var(--line) 35%, transparent); border-radius: var(--radius); padding: 14px; }
  .coluna > header { padding: 2px 4px 12px; }
  .coluna > header h2 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; }
  .coluna > header small { color: var(--muted); font-size: 13px; }
  .coluna .nada { color: var(--muted); font-size: 14px; padding: 18px 10px; text-align: center;
    border: 1.5px dashed var(--line); border-radius: 10px; }

  .medida { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
  .medida > summary { list-style: none; cursor: pointer; padding: 14px 16px; }
  .medida > summary::-webkit-details-marker { display: none; }
  .medida > summary .rot { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .medida > summary .resumo { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .medida[open] > summary .resumo { display: none; }
  .medida > summary .mais { font-size: 13px; color: var(--accent); margin-top: 8px; }
  .medida[open] > summary .mais { display: none; }
  .medida dl { margin: 0; padding: 0 16px 14px; }
  .medida dt { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-top: 12px; }
  .medida dd { margin: 3px 0 0; font-size: 15px; }
  .medida dd p { margin: 0 0 6px; }
  .medida dd ul, .medida dd ol { margin: 4px 0 6px; padding-left: 22px; }

  .form { max-width: 900px; }
  .form fieldset { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card);
    padding: 18px 22px 8px; margin: 0 0 18px; box-shadow: var(--shadow); }
  .form legend { font-weight: 700; font-size: 17px; padding: 0 8px; margin-left: -8px; }
  .form .intro { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .campo { margin-bottom: 16px; }
  .campo label.rot { display: block; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .campo .obrig { color: var(--descartada); margin-left: 2px; }
  .campo .opc { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .campo .ajuda { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .campo input[type=text], .campo textarea, .campo select { width: 100%; font: inherit; font-size: 15px;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
  .campo textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
  .campo input:focus, .campo textarea:focus, .campo select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .campo.erro input, .campo.erro textarea, .campo.erro select { border-color: var(--descartada); }
  .campo .msg-erro { color: var(--descartada); font-size: 13px; margin-top: 4px; display: none; }
  .campo.erro .msg-erro { display: block; }
  .tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
  @media (max-width: 760px) { .tres { grid-template-columns: 1fr; } }
  .opcoes { display: flex; gap: 18px; flex-wrap: wrap; }
  .opcoes label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .barra-envio { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
    padding: 14px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .barra-envio .salvo { color: var(--muted); font-size: 13px; margin-left: auto; }
  button.botao { border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 15px; }
  button.botao.sec { border: 1px solid var(--line); }
  .aviso-envio { margin-top: 14px; }
  .previa { margin: 0 0 18px; }
  .previa > h2 { margin-top: 0; }
  a.botao.nova { padding: 7px 14px; font-size: 14px; white-space: nowrap; }
  .medida .acoes { border-top: 1px solid var(--line); padding: 10px 16px; font-size: 14px;
    display: flex; gap: 16px; }

  .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .filtros input[type=search] { flex: 1 1 280px; }
  .lista .medida { max-width: 900px; }
  .contagem { color: var(--muted); font-size: 14px; margin-bottom: 12px; }

  table { border-collapse: collapse; width: 100%; background: var(--card); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow); font-size: 15px; }
  th, td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { background: color-mix(in srgb, var(--line) 50%, transparent); font-size: 13px;
    text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.c, th.c { text-align: center; }
  .matriz td.c { width: 120px; }
  .matriz .sim { color: var(--aprovada); font-weight: 700; cursor: help; }
  .matriz .nao { color: var(--muted); }
  .matriz tr.aberta td { background: var(--accent-soft); }
  .matriz .det td { font-size: 14px; color: var(--muted); background: var(--card); }
  .matriz .det b { color: var(--ink); }
  .matriz tbody tr.linha { cursor: pointer; }
  .matriz tr.grupo td { background: color-mix(in srgb, var(--line) 50%, transparent); font-weight: 700;
    font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent-ink); }

  .eixo { margin-bottom: 26px; scroll-margin-top: 80px; }
  .eixo-titulo { font-size: 16px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 24px; }
  .chip { font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); }
  .chip:hover { border-color: var(--accent); text-decoration: none; }
  label.check { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--muted); cursor: pointer; }

  .doc { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 26px 32px; max-width: 900px; box-shadow: var(--shadow); }
  .doc h1 { font-size: 26px; }
  .doc h2 { font-size: 19px; }
  .doc h3 { font-size: 16px; margin: 20px 0 8px; }
  .doc table { box-shadow: none; border: 1px solid var(--line); }
  .doc blockquote { margin: 0 0 16px; padding: 10px 16px; border-left: 4px solid var(--accent);
    background: var(--accent-soft); border-radius: 6px; }

  .botao { display: inline-block; background: var(--accent); color: #fff; padding: 9px 16px;
    border-radius: 8px; font-weight: 600; font-size: 15px; }
  .botao:hover { text-decoration: none; filter: brightness(1.08); }
  .botao.sec { background: var(--card); color: var(--accent); border: 1px solid var(--line); }
  .linha-botoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .fora { color: var(--muted); font-size: 14px; margin-top: 18px; }
  @media (max-width: 760px) {
    .topo .in { height: auto; flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
    .busca-topo { margin-left: 0; width: 100%; }
    .busca-topo input { width: 100%; }
    .hero, .doc { padding: 20px; }
  }
</style>
</head>
<body>
<header class="topo"><div class="in">
  <a class="marca" href="#/"><span class="selo">PG</span>Projeto de Governo</a>
  <nav class="menu" id="menu">
    <a href="#/" data-r="">Início</a>
    <a href="#/medidas" data-r="medidas">Medidas</a>
    <a href="#/competencias" data-r="competencias">Quem faz o quê</a>
    <a href="#/contribuir" data-r="contribuir">Como contribuir</a>
    <a href="#/modelo" data-r="modelo">Modelo</a>
  </nav>
  <div class="busca-topo"><input type="search" id="busca-topo" placeholder="Buscar medidas…" aria-label="Buscar medidas"></div>
  <a class="botao nova" href="#/propor">+ Nova proposta</a>
</div></header>
<main id="app"></main>

<script>
const D = /*__DADOS__*/null;

const cargoPor = Object.fromEntries(D.cargos.map(c => [c.id, c]));
const areaPor = Object.fromEntries(D.areas.map(a => [a.id, a]));
const PRAZO_CURTO = ["Curto", "Médio", "Longo"];
const SITUACOES = ["proposta", "em discussão", "aprovada", "descartada"];
const filtros = { q: "", cargo: "", prazo: "", situacao: "", area: "" };

// ---------- utilidades ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, "-");
const semAcento = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const sitTag = s => `<span class="tag sit-${slug(s)}">${esc(s)}</span>`;
const poderTag = c => `<span class="tag ${c.poder}">${c.poder === "executivo" ? "Executivo" : "Legislativo"}</span>`;
const medidasDe = (cargo, area) => D.medidas.filter(m => (!cargo || m.cargo === cargo) && (!area || m.area === area));
const linkArquivo = (cargo, area) => D.repo ? `${D.repo}/blob/main/cargos/${cargo}/${area}.md` : "";
const linkEditar = (cargo, area) => D.repo ? `${D.repo}/edit/main/cargos/${cargo}/${area}.md` : "";

// Converte links entre arquivos .md em rotas do site.
function rota(href) {
  const proprio = href.match(/^https:\/\/[\w-]+\.github\.io\/[\w.-]+\/?(#.*)?$/);
  if (proprio) return proprio[1] || "#/";
  if (/^(https?:|mailto:|#)/.test(href)) return href;
  const limpo = href.replace(/^(\.\.\/|\.\/)+/, "");
  let m;
  if (/(^|\/)README\.md$/.test(limpo) && !limpo.includes("cargos/")) return "#/";
  if (/COMPETENCIAS\.md$/.test(limpo)) return "#/competencias";
  if (/MODELO\.md$/.test(limpo)) return "#/modelo";
  if (/COMO-CONTRIBUIR\.md$/.test(limpo)) return "#/contribuir";
  if ((m = limpo.match(/cargos\/([\w-]+)\/README\.md$/))) return `#/cargo/${m[1]}`;
  if ((m = limpo.match(/cargos\/([\w-]+)\/([\w-]+)\.md$/))) return `#/cargo/${m[1]}/${m[2]}`;
  return D.repo ? `${D.repo}/blob/main/${limpo}` : href;
}

function inline(t) {
  const codigos = [];
  t = esc(t).replace(/`([^`]+)`/g, (_, c) => (codigos.push(c), `\u0000${codigos.length - 1}\u0000`));
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, href) => {
    const r = rota(href.replace(/&amp;/g, "&"));
    const ext = /^https?:/.test(r) ? ' target="_blank" rel="noopener"' : "";
    return `<a href="${esc(r)}"${ext}>${txt}</a>`;
  });
  t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
       .replace(/(^|[\s(])_(.+?)_(?=[\s.,;:)!?]|$)/g, "$1<i>$2</i>")
       .replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s.,;:)!?]|$)/g, "$1<i>$2</i>");
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codigos[i]}</code>`);
}

// Markdown simples: títulos, parágrafos, listas, tabelas, citações e código.
function markdown(src) {
  const linhas = src.replace(/<!--[\s\S]*?-->/g, "").split(/\r?\n/);
  let html = "", i = 0;
  const celulas = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  while (i < linhas.length) {
    const l = linhas[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < linhas.length && !linhas[i].startsWith("```")) buf.push(linhas[i++]);
      i++; html += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    let m = l.match(/^(#{1,6})\s+(.*)$/);
    if (m) { const n = m[1].length; html += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (l.trim().startsWith("|") && i + 1 < linhas.length && /^\s*\|?\s*:?-+/.test(linhas[i + 1])) {
      const cab = celulas(l), al = celulas(linhas[i + 1]).map(c => c.startsWith(":") && c.endsWith(":") ? "c" : "");
      i += 2; let corpo = "";
      while (i < linhas.length && linhas[i].trim().startsWith("|")) {
        corpo += "<tr>" + celulas(linhas[i]).map((c, k) => `<td class="${al[k] || ""}">${inline(c)}</td>`).join("") + "</tr>"; i++;
      }
      html += `<table><thead><tr>${cab.map((c, k) => `<th class="${al[k] || ""}">${inline(c)}</th>`).join("")}</tr></thead><tbody>${corpo}</tbody></table>`;
      continue;
    }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < linhas.length && linhas[i].startsWith(">")) buf.push(linhas[i++].replace(/^>\s?/, ""));
      html += `<blockquote>${markdown(buf.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ord = /^\s*\d+\./.test(l), itens = [];
      while (i < linhas.length && (/^\s*([-*]|\d+\.)\s+/.test(linhas[i]) || (/^\s{2,}\S/.test(linhas[i]) && itens.length))) {
        if (/^\s*([-*]|\d+\.)\s+/.test(linhas[i]) && !/^\s{2,}/.test(linhas[i])) itens.push(linhas[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        else itens[itens.length - 1] += " " + linhas[i].trim().replace(/^([-*]|\d+\.)\s+/, "");
        i++;
      }
      const tag = ord ? "ol" : "ul";
      html += `<${tag}>${itens.map(t => `<li>${inline(t)}</li>`).join("")}</${tag}>`; continue;
    }
    const buf = [];
    while (i < linhas.length && linhas[i].trim() && !/^(#|>|```|\s*\||\s*([-*]|\d+\.)\s)/.test(linhas[i])) buf.push(linhas[i++]);
    html += `<p>${inline(buf.join(" "))}</p>`;
  }
  return html;
}

function trilha(...partes) {
  return `<div class="trilha">${partes.map(([t, h]) => h ? `<a href="${h}">${esc(t)}</a>` : esc(t)).join("<span>›</span>")}</div>`;
}

// ---------- componentes ----------
function cartaoMedida(m, comContexto) {
  const c = cargoPor[m.cargo], a = areaPor[m.area];
  const campos = m.campos.filter(([k]) => !/^situação$/i.test(k));
  const oQue = (m.campos.find(([k]) => /^(solução em uma frase|o que é)$/i.test(k)) || [, ""])[1];
  const contexto = comContexto
    ? `<span class="tag">${esc(c.nome)}</span><span class="tag">${esc(a.nome)}</span><span class="tag">${PRAZO_CURTO[m.prazo]} prazo</span>`
    : "";
  return `<details class="medida">
    <summary>
      <div class="rot">${sitTag(m.situacao)}${contexto}</div>
      <h3>${inline(m.titulo)}</h3>
      ${oQue ? `<div class="resumo">${inline(oQue)}</div>` : ""}
      <div class="mais">Ver detalhes ▾</div>
    </summary>
    <dl>${campos.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${markdown(v)}</dd>`).join("")}
    ${m.notas ? `<dt>Observações</dt><dd>${markdown(m.notas)}</dd>` : ""}</dl>
    <div class="acoes">
      ${comContexto ? `<a href="#/cargo/${c.id}/${a.id}">Abrir a página da área</a>` : ""}
      ${D.repo ? `<a href="${linkArquivo(m.cargo, m.area)}" target="_blank" rel="noopener">Ver no GitHub ↗</a>` : ""}
    </div>
  </details>`;
}

function cartaoCargo(c) {
  const ms = medidasDe(c.id);
  const comMedida = new Set(ms.map(m => m.area)).size;
  return `<a class="cartao" href="#/cargo/${c.id}">
    <div class="rot">${poderTag(c)}<span class="tag">${esc(c.esferaNome)}</span></div>
    <h3>${esc(c.nome)}</h3>
    <p>${esc(c.papel.split(/(?<=\.)\s/)[0])}</p>
    <div class="rodape"><span><b>${c.areas.length}</b> áreas</span><span><b>${ms.length}</b> ${ms.length === 1 ? "medida" : "medidas"}</span><span>${c.mandato} anos</span></div>
  </a>`;
}

// ---------- páginas ----------

    <h2>Legislativo</h2>

    ${recentes.length ? `<h2>Algumas medidas</h2><div class="lista">${recentes.map(m => cartaoMedida(m, true)).join("")}</div>` : ""}`;

function paginaCargo(id) {
  const c = cargoPor[id];
  if (!c) return naoAchou();
  const fora = D.areas.filter(a => !c.areas.includes(a.id)).map(a => a.nome);
  const cartao = aid => {
    const a = areaPor[aid], ms = medidasDe(id, aid);
    const por = [0, 1, 2].map(p => ms.filter(m => m.prazo === p).length);
    return `<a class="cartao ${ms.length ? "" : "vazio"}" href="#/cargo/${id}/${aid}" data-nome="${esc(semAcento(a.nome))}" data-tem="${ms.length ? 1 : 0}">
      <h3>${esc(a.nome)}</h3>
      <div class="barras">${por.map((n, i) => `<i class="${n ? "tem" : ""}" title="${PRAZO_CURTO[i]} prazo: ${n}"></i>`).join("")}</div>
      <div class="rodape">${por.map((n, i) => `<span>${PRAZO_CURTO[i]} <b>${n}</b></span>`).join("")}</div>
    </a>`;
  };
  const grupos = D.eixos.map(ex => {
    const doEixo = c.areas.filter(aid => areaPor[aid].eixo === ex.id);
    return doEixo.length ? `<section class="eixo" id="eixo-${ex.id}">
      <h3 class="eixo-titulo">${esc(ex.nome)} <span class="tag">${doEixo.length}</span></h3>
      <div class="grade">${doEixo.map(cartao).join("")}</div></section>` : "";
  }).join("");
  const atalhos = D.eixos.filter(ex => c.areas.some(aid => areaPor[aid].eixo === ex.id))
    .map(ex => `<a class="chip" href="javascript:void 0" data-eixo="${ex.id}">${esc(ex.nome)}</a>`).join("");
  return `
    ${trilha(["Início", "#/"], [c.nome])}
    <div class="rot" style="display:flex;gap:6px;margin-bottom:10px">${poderTag(c)}<span class="tag">${esc(c.esferaNome)}</span><span class="tag">Mandato de ${c.mandato} anos</span></div>
    <h1>${esc(c.nome)}</h1>
    <p class="sub">${esc(c.papel)}</p>
    ${c.extra ? `<div class="aviso"><p>${inline(c.extra)}</p></div>` : ""}
    ${c.cuidado ? `<div class="aviso leg"><p><b>Atenção:</b> ${inline(c.cuidado)}</p></div>` : ""}
    <h2>Áreas (${c.areas.length})</h2>
    <div class="filtros">
      <input type="search" id="f-areas" placeholder="Filtrar áreas pelo nome…">
      <label class="check"><input type="checkbox" id="f-tem"> Só áreas com medidas</label>
    </div>
    <div class="chips">${atalhos}</div>
    ${grupos}
    <div class="cartao" id="sem-areas" hidden><p>Nenhuma área com esse filtro.</p></div>
    ${fora.length ? `<p class="fora"><b>Fora da competência:</b> ${esc(fora.join(", "))}. Essas áreas não são da esfera ${esc(c.esferaNome.toLowerCase())}, por isso não têm página aqui.</p>` : ""}`;
}

function paginaArea(cid, aid) {
  const c = cargoPor[cid], a = areaPor[aid];
  if (!c || !a || !c.areas.includes(aid)) return naoAchou();
  const ms = medidasDe(cid, aid);
  const texto = a[c.esfera];
  const colunas = D.prazos.map((p, i) => {
    const doPrazo = ms.filter(m => m.prazo === i);
    return `<section class="coluna">
      <header><h2>${esc(p.nome)} <span class="tag">${doPrazo.length}</span></h2>
      <small>${esc(p.descricao.replace("{mandato}", c.mandato))}</small></header>
      ${doPrazo.length ? doPrazo.map(m => cartaoMedida(m, false)).join("") : `<div class="nada">Nenhuma medida ainda.</div>`}
    </section>`;
  }).join("");
  return `
    ${trilha(["Início", "#/"], [c.nome, `#/cargo/${cid}`], [a.nome])}
    <h1>${esc(a.nome)}</h1>
    <p class="sub">${esc(c.nome)} · ${esc(c.esferaNome)}</p>
    ${c.poder === "executivo"
      ? `<div class="aviso"><p><b>O que este cargo faz nesta área:</b> ${esc(texto)}</p></div>`
      : `<div class="aviso leg"><p><b>Esta área na esfera ${esc(c.esfera)}:</b> ${esc(texto)}</p>
         <p><b>Como o mandato atua aqui:</b> com leis, emendas ao orçamento e fiscalização. Veja os limites na <a href="#/cargo/${cid}">página do cargo</a>.</p></div>`}
    <div class="linha-botoes" style="margin:0 0 22px">
      <a class="botao" href="#/propor/${cid}/${aid}">+ Nova proposta nesta área</a>
      <a class="botao sec" href="#/modelo">Como escrever uma medida</a>
    </div>
    <div class="prazos">${colunas}</div>`;
}

function paginaMedidas() {
  const opc = (lista, sel) => lista.map(([v, t]) => `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(t)}</option>`).join("");
  return `
    ${trilha(["Início", "#/"], ["Medidas"])}
    <h1>Medidas</h1>
    <p class="sub">Todas as propostas de todos os cargos. Busque por palavra ou filtre por cargo, área, prazo e situação.</p>
    <div class="filtros">
      <input type="search" id="f-q" placeholder="Buscar por palavra (ex.: fila, IPTU, emendas)…" value="${esc(filtros.q)}">
      <select id="f-cargo"><option value="">Todos os cargos</option>${opc(D.cargos.map(c => [c.id, c.nome]), filtros.cargo)}</select>
      <select id="f-area"><option value="">Todas as áreas</option>${D.eixos.map(ex => `<optgroup label="${esc(ex.nome)}">${opc(D.areas.filter(a => a.eixo === ex.id).map(a => [a.id, a.nome]), filtros.area)}</optgroup>`).join("")}</select>
      <select id="f-prazo"><option value="">Todos os prazos</option>${opc(PRAZO_CURTO.map((p, i) => [String(i), p + " prazo"]), filtros.prazo)}</select>
      <select id="f-situacao"><option value="">Todas as situações</option>${opc(SITUACOES.map(s => [s, s[0].toUpperCase() + s.slice(1)]), filtros.situacao)}</select>
    </div>
    <div class="contagem" id="contagem"></div>
    <div class="lista" id="lista"></div>`;
}

function atualizarLista() {
  const q = semAcento(filtros.q.trim());
  const ms = D.medidas.filter(m =>
    (!filtros.cargo || m.cargo === filtros.cargo) &&
    (!filtros.area || m.area === filtros.area) &&
    (filtros.prazo === "" || m.prazo === Number(filtros.prazo)) &&
    (!filtros.situacao || m.situacao === filtros.situacao) &&
    (!q || semAcento([m.titulo, m.notas, ...m.campos.flat(), cargoPor[m.cargo].nome, areaPor[m.area].nome].join(" ")).includes(q)));
  document.getElementById("contagem").textContent = plural(ms.length, "medida encontrada", "medidas encontradas");
  document.getElementById("lista").innerHTML = ms.length
    ? ms.map(m => cartaoMedida(m, true)).join("")
    : `<div class="cartao"><p>Nenhuma medida com esses filtros.</p></div>`;
}

function paginaCompetencias() {
  const esf = ["federal", "estadual", "municipal"];
  const linhaArea = a => `
    <tr class="linha" data-area="${a.id}"><td>${esc(a.nome)}</td>
      ${esf.map(e => a[e] ? `<td class="c"><span class="sim" title="${esc(a[e])}">✓</span></td>` : `<td class="c"><span class="nao">—</span></td>`).join("")}</tr>
    <tr class="det" data-det="${a.id}" hidden><td colspan="4">
      ${esf.map(e => `<p><b>${esc(D.esferas[e])}:</b> ${a[e] ? esc(a[e]) : "não é competência desta esfera."}</p>`).join("")}
    </td></tr>`;
  const linhas = D.eixos.map(ex => `<tr class="grupo"><td colspan="4">${esc(ex.nome)}</td></tr>`
    + D.areas.filter(a => a.eixo === ex.id).map(linhaArea).join("")).join("");
  const cargos = esf.map(e => `<div class="cartao"><h3>${esc(D.esferas[e])}</h3>
    <p>${D.cargos.filter(c => c.esfera === e).map(c => `<a href="#/cargo/${c.id}">${esc(c.nome)}</a>`).join(" · ")}</p></div>`).join("");
  return `
    ${trilha(["Início", "#/"], ["Quem faz o quê"])}
    <h1>Quem faz o quê</h1>
    <p class="sub">Nem todo cargo pode agir em toda área. A Constituição divide as competências entre União,
    estados e municípios. Dentro de cada esfera, o <b>Executivo</b> executa e o <b>Legislativo</b> legisla e fiscaliza.
    Clique numa área para ver o que cada esfera faz nela.</p>
    <div class="grade" style="margin-bottom:24px">${cargos}</div>
    <table class="matriz"><thead><tr><th>Área</th>${esf.map(e => `<th class="c">${esc(D.esferas[e])}</th>`).join("")}</tr></thead>
    <tbody>${linhas}</tbody></table>`;
}

function paginaDoc(nome, titulo) {
  const src = D.docs[nome];
  if (!src) return naoAchou();
  return `${trilha(["Início", "#/"], [titulo])}<article class="doc">${markdown(src)}</article>`;
}

const CHAVE_RASCUNHO = "projeto-de-governo:rascunho";

function lerRascunho() {
  try { return JSON.parse(localStorage.getItem(CHAVE_RASCUNHO)) || {}; } catch { return {}; }
}

function opcoesArea(cid, sel) {
  const c = cargoPor[cid];
  if (!c) return `<option value="">Escolha o cargo primeiro</option>`;
  return `<option value="">Escolha a área</option>` + D.eixos.map(ex => {
    const as = c.areas.filter(aid => areaPor[aid].eixo === ex.id);
    return as.length ? `<optgroup label="${esc(ex.nome)}">${as.map(aid =>
      `<option value="${aid}" ${aid === sel ? "selected" : ""}>${esc(areaPor[aid].nome)}</option>`).join("")}</optgroup>` : "";
  }).join("");
}

function opcoesPrazo(cid, sel) {
  const c = cargoPor[cid];
  return `<option value="">Escolha o prazo</option>` + D.prazos.map((p, i) =>
    `<option value="${i}" ${String(i) === String(sel) ? "selected" : ""}>${esc(p.nome)}: ${esc(p.descricao.replace("{mandato}", c ? c.mandato : 4)).replace(/\.$/, "")}</option>`).join("");
}

function campoHTML(f, v) {
  if (f.id === "_local") {
    return `<div class="tres">
      <div class="campo" data-campo="cargo"><label class="rot" for="p-cargo">Cargo<span class="obrig">*</span></label>
        <select id="p-cargo" name="cargo"><option value="">Escolha o cargo</option>${D.cargos.map(c =>
          `<option value="${c.id}" ${c.id === v.cargo ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select>
        <div class="msg-erro">Escolha o cargo.</div></div>
      <div class="campo" data-campo="area"><label class="rot" for="p-area">Área<span class="obrig">*</span></label>
        <select id="p-area" name="area">${opcoesArea(v.cargo, v.area)}</select>
        <div class="msg-erro">Escolha a área.</div></div>
      <div class="campo" data-campo="prazo"><label class="rot" for="p-prazo">Prazo<span class="obrig">*</span></label>
        <select id="p-prazo" name="prazo">${opcoesPrazo(v.cargo, v.prazo)}</select>
        <div class="msg-erro">Escolha o prazo.</div></div>
    </div>
    <p class="ajuda" id="p-competencia" style="margin:-6px 0 16px;color:var(--muted);font-size:14px"></p>`;
  }
  if (f.id === "_evidencia") {
    return `<div class="campo"><span class="rot" style="font-weight:600;display:block;margin-bottom:6px">Existe comprovação científica de que a solução funciona?</span>
      <div class="opcoes">
        <label><input type="radio" name="evidencia" value="sim" ${v.evidencia === "sim" ? "checked" : ""}> Sim</label>
        <label><input type="radio" name="evidencia" value="nao" ${v.evidencia === "nao" ? "checked" : ""}> Não, ou não sei: vamos propor um teste</label>
      </div></div>`;
  }
  const valor = v[f.id] || "";
  const entrada = f.tipo === "linha"
    ? `<input type="text" id="p-${f.id}" name="${f.id}" value="${esc(valor)}">`
    : `<textarea id="p-${f.id}" name="${f.id}" rows="${f.tipo === "lista" ? 3 : 4}">${esc(valor)}</textarea>`;
  return `<div class="campo" data-campo="${f.id}" ${f.se ? `data-se="${f.se}" ${v.evidencia === f.se ? "" : "hidden"}` : ""}>
    <label class="rot" for="p-${f.id}">${esc(f.rot)}${f.obrig ? `<span class="obrig">*</span>` : `<span class="opc">opcional</span>`}</label>
    ${f.ajuda ? `<p class="ajuda">${esc(f.ajuda)}</p>` : ""}
    ${entrada}
    <div class="msg-erro">Preencha este campo.</div>
  </div>`;
}

function paginaPropor(cid, aid) {
  const v = lerRascunho();
  if (cargoPor[cid]) { v.cargo = cid; v.area = cargoPor[cid].areas.includes(aid) ? aid : ""; }
  let html = "", aberto = false;
  for (const f of PROPOSTA) {
    if (f.grupo) {
      html += (aberto ? "</fieldset>" : "") + `<fieldset><legend>${esc(f.grupo)}</legend><p class="intro">${esc(f.intro)}</p>`;
      aberto = true;
    } else html += campoHTML(f, v);
  }
  html += "</fieldset>";
  return `
    ${trilha(["Início", "#/"], ["Nova proposta"])}
    <h1>Nova proposta</h1>
    <p class="sub">Preencha o que souber. Só os campos com <span style="color:var(--descartada)">*</span> são obrigatórios,
    mas uma proposta com dados, exemplos e prós e contras tem muito mais chance de ser aprovada.
    O rascunho fica salvo neste navegador enquanto você escreve.</p>
    <form class="form" id="form-proposta" novalidate>
      ${html}
      <section class="previa" id="previa" hidden></section>
      <div class="barra-envio">
        <button type="button" class="botao" id="b-issue">Enviar como sugestão ↗</button>
        <button type="button" class="botao sec" id="b-pr">Escrever direto na página ↗</button>
        <button type="button" class="botao sec" id="b-previa">Pré-visualizar</button>
        <button type="button" class="botao sec" id="b-copiar">Copiar texto</button>
        <button type="button" class="botao sec" id="b-baixar">Baixar .md</button>
        <button type="button" class="botao sec" id="b-limpar">Limpar</button>
        <span class="salvo" id="salvo"></span>
      </div>
      <div class="aviso aviso-envio" id="aviso-envio" hidden></div>
    </form>`;
}

function valoresProposta() {
  const form = document.getElementById("form-proposta");
  const v = Object.fromEntries(new FormData(form).entries());
  v.evidencia = v.evidencia || "";
  return v;
}

function validarProposta(v) {
  const faltando = ["titulo", "cargo", "area", "prazo", "relator", "problema", "resumo", "descricao"].filter(k => !String(v[k] || "").trim());
  document.querySelectorAll("#form-proposta .campo").forEach(el => el.classList.toggle("erro", faltando.includes(el.dataset.campo)));
  if (faltando.length) {
    const primeiro = document.querySelector(`#form-proposta .campo[data-campo="${faltando[0]}"]`);
    primeiro?.scrollIntoView({ behavior: "smooth", block: "center" });
    primeiro?.querySelector("input, textarea, select")?.focus({ preventScroll: true });
  }
  return !faltando.length;
}

// Texto livre seguro para o markdown da página: sem títulos que quebrem a estrutura.
const textoMd = s => String(s || "").trim().replace(/\r/g, "").replace(/^(\s*)#/gm, "$1\\#").replace(/\n{3,}/g, "\n\n");
const linhaMd = s => String(s || "").replace(/\s+/g, " ").trim();
const listaMd = s => String(s || "").split(/\r?\n/).map(l => l.trim().replace(/^([-*•]|\d+[.)])\s+/, "")).filter(Boolean)
  .map(l => "- " + l.replace(/^#/, "\\#")).join("\n");

function camposProposta(v) {
  const usados = PROPOSTA.filter(f => f.rot && f.id !== "titulo" && (!f.se || v.evidencia === f.se) && String(v[f.id] || "").trim());
  const valor = f => f.tipo === "lista" ? listaMd(v[f.id]) : f.tipo === "linha" ? linhaMd(v[f.id]) : textoMd(v[f.id]);
  const itens = usados.filter(f => f.md === "item").sort((x, y) => (y.id === "resumo") - (x.id === "resumo")).map(f => [f.rot, valor(f)]);
  const secoes = usados.filter(f => f.md !== "item").map(f => [f.rot, valor(f)]);
  return { itens: [...itens, ["Situação", "proposta"]], secoes };
}

function markdownProposta(v) {
  const { itens, secoes } = camposProposta(v);
  return [`### ${linhaMd(v.titulo)}`, "", ...itens.map(([k, x]) => `- **${k}:** ${x}`), "",
    ...secoes.flatMap(([k, x]) => [`#### ${k}`, "", x, ""])].join("\n");
}

function destinoProposta(v) {
  const c = cargoPor[v.cargo], a = areaPor[v.area], p = D.prazos[Number(v.prazo)];
  return { c, a, p, arquivo: `cargos/${v.cargo}/${v.area}.md` };
}

function corpoIssue(v, md) {
  const { c, a, p, arquivo } = destinoProposta(v);
  return `**Cargo:** ${c.nome} · **Área:** ${a.nome} · **Prazo:** ${p.nome}\n` +
    `**Página:** [${arquivo}](${D.repo}/blob/main/${arquivo})\n\n---\n\n${md}`;
}

async function copiarTexto(texto) {
  try { await navigator.clipboard.writeText(texto); return true; } catch {
    const t = Object.assign(document.createElement("textarea"), { value: texto });
    document.body.append(t); t.select();
    const ok = document.execCommand("copy"); t.remove(); return ok;
  }
}

function avisoEnvio(html) {
  const el = document.getElementById("aviso-envio");
  el.innerHTML = html; el.hidden = false;
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function ligarPropor() {
  const form = document.getElementById("form-proposta");
  const sel = id => document.getElementById(id);
  let timer;
  const salvar = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify(valoresProposta()));
      sel("salvo").textContent = "Rascunho salvo neste navegador";
    }, 400);
  };
  const competencia = () => {
    const c = cargoPor[sel("p-cargo").value], a = areaPor[sel("p-area").value];
    sel("p-competencia").innerHTML = c && a
      ? `<b>${esc(c.poder === "executivo" ? "O que este cargo faz nesta área" : "Esta área na esfera " + c.esfera)}:</b> ${esc(a[c.esfera])}`
      : "";
  };
  sel("p-cargo").addEventListener("change", () => {
    const area = sel("p-area").value, prazo = sel("p-prazo").value;
    sel("p-area").innerHTML = opcoesArea(sel("p-cargo").value, area);
    sel("p-prazo").innerHTML = opcoesPrazo(sel("p-cargo").value, prazo);
  });
  form.addEventListener("input", salvar);
  form.addEventListener("change", ev => {
    if (ev.target.name === "evidencia")
      form.querySelectorAll("[data-se]").forEach(el => el.hidden = el.dataset.se !== ev.target.value);
    competencia(); salvar();
  });
  competencia();

  const pronto = () => { const v = valoresProposta(); return validarProposta(v) ? v : null; };

  sel("b-previa").addEventListener("click", () => {
    const v = pronto(); if (!v) return;
    const { itens, secoes } = camposProposta(v);
    const m = { cargo: v.cargo, area: v.area, prazo: Number(v.prazo), titulo: linhaMd(v.titulo),
      situacao: "proposta", campos: [...itens, ...secoes], notas: "" };
    const previa = sel("previa");
    previa.innerHTML = `<h2>Pré-visualização</h2>${cartaoMedida(m, true)}`;
    previa.querySelector("details").open = true;
    previa.hidden = false;
    previa.scrollIntoView({ behavior: "smooth" });
  });

  sel("b-issue").addEventListener("click", async () => {
    const v = pronto(); if (!v) return;
    const md = markdownProposta(v), corpo = corpoIssue(v, md);
    const base = `${D.repo}/issues/new?labels=medida,proposta&title=${encodeURIComponent("[Medida] " + linhaMd(v.titulo))}`;
    let url = `${base}&body=${encodeURIComponent(corpo)}`;
    if (url.length > 7000) {
      await copiarTexto(corpo);
      url = `${base}&body=${encodeURIComponent("(Cole aqui o texto da proposta: ele já está copiado. Use Ctrl+V.)")}`;
      avisoEnvio(`<p><b>A proposta é longa, então o texto foi copiado.</b> Na página do GitHub que abriu, apague a frase da descrição e cole com <b>Ctrl+V</b>. Depois clique em <b>Submit new issue</b>.</p>`);
    } else {
      avisoEnvio(`<p><b>Abrimos a página do GitHub com a proposta preenchida.</b> Confira e clique em <b>Submit new issue</b>. A discussão acontece nos comentários, e a coordenação passa a medida para a página da área quando houver acordo.</p>`);
    }
    window.open(url, "_blank", "noopener");
  });

  sel("b-pr").addEventListener("click", async () => {
    const v = pronto(); if (!v) return;
    const { p, arquivo } = destinoProposta(v);
    await copiarTexto("\n" + markdownProposta(v));
    window.open(`${D.repo}/edit/main/${arquivo}`, "_blank", "noopener");
    avisoEnvio(`<p><b>O texto da proposta foi copiado.</b> Na página que abriu (<code>${esc(arquivo)}</code>):</p>
      <ol><li>Procure a seção <b>## ${esc(p.nome)}</b> e, logo abaixo da linha <code>&lt;!-- Adicione as medidas aqui… --&gt;</code>, cole com <b>Ctrl+V</b>.</li>
      <li>Clique em <b>Commit changes…</b>, escolha <i>Create a new branch and start a pull request</i> e confirme.</li></ol>
      <p>Se o GitHub pedir, faça um <i>fork</i>: é normal para quem não é da coordenação.</p>`);
  });

  sel("b-copiar").addEventListener("click", async () => {
    const v = pronto(); if (!v) return;
    const ok = await copiarTexto(markdownProposta(v));
    avisoEnvio(ok ? `<p>Texto copiado no formato do <a href="#/modelo">modelo de medida</a>.</p>` : `<p>Não foi possível copiar. Use “Baixar .md”.</p>`);
  });

  sel("b-baixar").addEventListener("click", () => {
    const v = pronto(); if (!v) return;
    const blob = new Blob([corpoIssue(v, markdownProposta(v))], { type: "text/markdown;charset=utf-8" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `${slug(linhaMd(v.titulo)).replace(/[^a-z0-9-]/g, "") || "proposta"}.md` });
    a.click(); URL.revokeObjectURL(a.href);
  });

  sel("b-limpar").addEventListener("click", () => {
    if (!confirm("Apagar tudo o que foi escrito nesta proposta?")) return;
    localStorage.removeItem(CHAVE_RASCUNHO);
    render();
  });
}

function naoAchou() {
  return `<h1>Página não encontrada</h1><p class="sub">Esse endereço não existe no projeto.</p><a class="botao" href="#/">Voltar ao início</a>`;
}

// ---------- roteamento ----------
function render() {
  const partes = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  const [p0, p1, p2] = partes;
  let html;
  if (!p0) html = paginaInicio();
  else if (p0 === "cargo" && p2) html = paginaArea(p1, p2);
  else if (p0 === "cargo") html = paginaCargo(p1);
  else if (p0 === "medidas") html = paginaMedidas();
  else if (p0 === "competencias") html = paginaCompetencias();
  else if (p0 === "contribuir") html = paginaDoc("contribuir", "Como contribuir");
  else if (p0 === "modelo") html = paginaDoc("modelo", "Modelo de medida");
  else if (p0 === "propor") html = paginaPropor(p1, p2);
  else html = naoAchou();

  const app = document.getElementById("app");
  app.innerHTML = html;
  document.querySelectorAll("#menu a").forEach(a => a.classList.toggle("ativo", a.dataset.r === (p0 === "cargo" ? "" : p0 || "")));

  if (p0 === "medidas") {
    for (const k of ["q", "cargo", "area", "prazo", "situacao"]) {
      const el = document.getElementById("f-" + k);
      el.addEventListener("input", () => { filtros[k] = el.value; atualizarLista(); });
    }
    atualizarLista();
  }
  if (p0 === "cargo" && p1 && !p2 && cargoPor[p1]) {
    const busca = document.getElementById("f-areas"), tem = document.getElementById("f-tem");
    const filtrar = () => {
      const q = semAcento(busca.value.trim());
      let visiveis = 0;
      app.querySelectorAll(".eixo").forEach(sec => {
        let n = 0;
        sec.querySelectorAll("a.cartao").forEach(a => {
          const ok = (!q || a.dataset.nome.includes(q)) && (!tem.checked || a.dataset.tem === "1");
          a.hidden = !ok; n += ok;
        });
        sec.hidden = !n; visiveis += n;
      });
      document.getElementById("sem-areas").hidden = visiveis > 0;
    };
    busca.addEventListener("input", filtrar);
    tem.addEventListener("change", filtrar);
    app.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () =>
      document.getElementById("eixo-" + ch.dataset.eixo)?.scrollIntoView({ behavior: "smooth" })));
  }
  if (p0 === "propor") ligarPropor();
  if (p0 === "competencias") {
    app.querySelectorAll("tr.linha").forEach(tr => tr.addEventListener("click", () => {
      const det = app.querySelector(`tr[data-det="${tr.dataset.area}"]`);
      det.hidden = !det.hidden; tr.classList.toggle("aberta", !det.hidden);
    }));
  }
  document.title = (app.querySelector("h1")?.textContent || "") + " · Projeto de Governo";
  window.scrollTo(0, 0);
}

const buscaTopo = document.getElementById("busca-topo");
buscaTopo.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  Object.assign(filtros, { q: buscaTopo.value, cargo: "", area: "", prazo: "", situacao: "" });
  buscaTopo.value = "";
  if (location.hash === "#/medidas") render(); else location.hash = "#/medidas";
});
window.addEventListener("hashchange", render);
render();
</script>
