name: Atualizar índices

on:
  push:
    branches: [main]
    paths:
      - "cargos/**"
      - "ferramentas/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ferramentas/estrutura.py
      - name: Commit dos índices
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Atualiza índices e contagens"
            git push
          fi
