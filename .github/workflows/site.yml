name: Publicar site

# Gera o site (ferramentas/gerar_site.py) e publica no GitHub Pages a cada
# mudança na main.

on:
  push:
    branches: [main]
    paths:
      - "cargos/**"
      - "ferramentas/**"
      - "*.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ferramentas/gerar_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
