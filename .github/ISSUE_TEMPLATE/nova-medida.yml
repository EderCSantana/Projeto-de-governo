name: Nova medida
description: Sugira uma medida para o programa de governo
title: "[Medida] "
labels: ["medida", "proposta"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar, confira em COMPETENCIAS.md se o cargo pode agir nessa área.
  - type: dropdown
    id: cargo
    attributes:
      label: Cargo
      options:
        - "Presidente da República"
        - "Governador(a)"
        - "Prefeito(a)"
        - "Senador(a)"
        - "Deputado(a) federal"
        - "Deputado(a) estadual ou distrital"
        - "Vereador(a)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        # inicio:areas (gerado por ferramentas/estrutura.py)
        - "Saúde"
        - "Educação"
        - "Assistência social"
        - "Previdência social"
        - "Segurança alimentar"
        - "Cultura"
        - "Patrimônio cultural"
        - "Esporte"
        - "Lazer"
        - "Direitos humanos"
        - "Mulheres"
        - "Igualdade racial"
        - "Pessoas com deficiência"
        - "Pessoas idosas"
        - "Crianças e adolescentes"
        - "Juventude"
        - "População LGBTQIA+"
        - "População em situação de rua"
        - "Migrantes"
        - "Povos indígenas"
        - "Quilombolas"
        - "Comunidades tradicionais"
        - "Participação social"
        - "Acesso à justiça"
        - "Segurança pública"
        - "Sistema prisional"
        - "Política sobre drogas"
        - "Defesa civil"
        - "Defesa do consumidor"
        - "Desenvolvimento econômico"
        - "Desenvolvimento regional"
        - "Indústria"
        - "Comércio"
        - "Comércio exterior"
        - "Empreendedorismo"
        - "Economia solidária"
        - "Defesa da concorrência"
        - "Trabalho"
        - "Emprego"
        - "Renda"
        - "Turismo"
        - "Agricultura"
        - "Agricultura familiar"
        - "Pecuária"
        - "Pesca"
        - "Abastecimento"
        - "Reforma agrária"
        - "Obras públicas"
        - "Rodovias"
        - "Ferrovias"
        - "Hidrovias"
        - "Portos"
        - "Aeroportos"
        - "Transporte público"
        - "Trânsito"
        - "Mobilidade ativa"
        - "Energia"
        - "Combustíveis"
        - "Mineração"
        - "Iluminação pública"
        - "Habitação"
        - "Regularização fundiária"
        - "Planejamento urbano"
        - "Saneamento básico"
        - "Zeladoria urbana"
        - "Meio ambiente"
        - "Mudança do clima"
        - "Florestas"
        - "Biodiversidade"
        - "Recursos hídricos"
        - "Resíduos sólidos"
        - "Proteção animal"
        - "Ciência"
        - "Inovação"
        - "Inclusão digital"
        - "Telecomunicações"
        - "Radiodifusão"
        - "Comunicação pública"
        - "Serviço postal"
        - "Política econômica"
        - "Orçamento público"
        - "Tributos"
        - "Dívida pública"
        - "Gestão pública"
        - "Servidores públicos"
        - "Compras públicas"
        - "Transparência"
        - "Combate à corrupção"
        - "Governo digital"
        - "Atendimento ao cidadão"
        - "Cooperação federativa"
        - "Defesa nacional"
        - "Relações exteriores"
        # fim:areas
    validations:
      required: true
  - type: dropdown
    id: prazo
    attributes:
      label: Prazo
      options:
        - "Curto prazo (primeiro ano)"
        - "Médio prazo (até o fim do mandato)"
        - "Longo prazo (além do mandato)"
    validations:
      required: true
  - type: textarea
    id: medida
    attributes:
      label: O que é a medida
      description: Em uma ou duas frases.
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Problema que resolve
      description: Com dados e fonte, se houver.
  - type: textarea
    id: como
    attributes:
      label: Como fazer
      description: Lei, decreto, programa, emenda ao orçamento, parceria...
  - type: input
    id: custo
    attributes:
      label: Custo estimado e fonte dos recursos
  - type: input
    id: meta
    attributes:
      label: Como medir
      description: Indicador e meta, com número e prazo.
