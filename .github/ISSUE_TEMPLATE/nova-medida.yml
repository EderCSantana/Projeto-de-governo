name: Nova medida
description: Sugira uma medida para o programa de governo
title: "[Medida] "
labels: ["medida", "proposta"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar, confira em COMPETENCIAS.md se o cargo pode agir nessa área.

        Prefere um formulário mais guiado? Use **Nova proposta** no site do projeto:
        https://edercsantana.github.io/Projeto-de-governo/#/propor
  - type: dropdown
    id: cargo
    attributes:
      label: "Cargo"
      options:
        - "Presidente da República"
        - "Governador(a)"
        - "Prefeito(a)"
        - "Senador(a)"
        - "Deputado(a) federal"
        - "Deputado(a) estadual ou distrital"
        - "Vereador(a)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Área"
      options:
        # inicio:areas (gerado por ferramentas/estrutura.py)
        - "Saúde"
        - "Educação"
        - "Assistência social"
        - "Previdência social"
        - "Segurança alimentar"
        - "Cultura"
        - "Patrimônio cultural"
        - "Esporte"
        - "Lazer"
        - "Direitos humanos"
        - "Mulheres"
        - "Igualdade racial"
        - "Pessoas com deficiência"
        - "Pessoas idosas"
        - "Crianças e adolescentes"
        - "Juventude"
        - "População LGBTQIA+"
        - "População em situação de rua"
        - "Migrantes"
        - "Povos indígenas"
        - "Quilombolas"
        - "Comunidades tradicionais"
        - "Participação social"
        - "Acesso à justiça"
        - "Segurança pública"
        - "Sistema prisional"
        - "Política sobre drogas"
        - "Defesa civil"
        - "Defesa do consumidor"
        - "Desenvolvimento econômico"
        - "Desenvolvimento regional"
        - "Indústria"
        - "Comércio"
        - "Comércio exterior"
        - "Empreendedorismo"
        - "Economia solidária"
        - "Defesa da concorrência"
        - "Trabalho"
        - "Emprego"
        - "Renda"
        - "Turismo"
        - "Agricultura"
        - "Agricultura familiar"
        - "Pecuária"
        - "Pesca"
        - "Abastecimento"
        - "Reforma agrária"
        - "Obras públicas"
        - "Rodovias"
        - "Ferrovias"
        - "Hidrovias"
        - "Portos"
        - "Aeroportos"
        - "Transporte público"
        - "Trânsito"
        - "Mobilidade ativa"
        - "Energia"
        - "Combustíveis"
        - "Mineração"
        - "Iluminação pública"
        - "Habitação"
        - "Regularização fundiária"
        - "Planejamento urbano"
        - "Saneamento básico"
        - "Zeladoria urbana"
        - "Meio ambiente"
        - "Mudança do clima"
        - "Florestas"
        - "Biodiversidade"
        - "Recursos hídricos"
        - "Resíduos sólidos"
        - "Proteção animal"
        - "Ciência"
        - "Inovação"
        - "Inclusão digital"
        - "Telecomunicações"
        - "Radiodifusão"
        - "Comunicação pública"
        - "Serviço postal"
        - "Política econômica"
        - "Orçamento público"
        - "Tributos"
        - "Dívida pública"
        - "Gestão pública"
        - "Servidores públicos"
        - "Compras públicas"
        - "Transparência"
        - "Combate à corrupção"
        - "Governo digital"
        - "Atendimento ao cidadão"
        - "Cooperação federativa"
        - "Defesa nacional"
        - "Relações exteriores"
        # fim:areas
    validations:
      required: true
  - type: dropdown
    id: prazo
    attributes:
      label: "Prazo"
      options:
        - "Curto prazo (primeiro ano)"
        - "Médio prazo (até o fim do mandato)"
        - "Longo prazo (além do mandato)"
    validations:
      required: true
  - type: input
    id: titulo_curto
    attributes:
      label: "Solução em uma frase"
      description: "A medida, de forma direta."
    validations:
      required: true
  - type: input
    id: relator
    attributes:
      label: "Relator(a)"
      description: "Nome e núcleo, ou @usuario do GitHub."
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: "Problema a ser resolvido"
      description: "Qual é o problema e quem ele atinge."
    validations:
      required: true
  - type: textarea
    id: referencias
    attributes:
      label: "Por que é um problema: referências"
      description: "Dados, estudos, reportagens e links. Um por linha."
  - type: textarea
    id: prob_cidadaos
    attributes:
      label: "Impacto do problema na vida dos cidadãos"
  - type: textarea
    id: prob_economia
    attributes:
      label: "Impacto do problema na economia"
  - type: textarea
    id: prob_outras
    attributes:
      label: "Impacto do problema em outras áreas"
      description: "Se houver."
  - type: textarea
    id: descricao
    attributes:
      label: "Descrição da solução proposta"
      description: "O que muda, para quem e quem executa."
    validations:
      required: true
  - type: textarea
    id: como
    attributes:
      label: "Como fazer"
      description: "Lei, decreto, programa, emenda ao orçamento, parceria... e os passos principais."
  - type: textarea
    id: exemplos
    attributes:
      label: "Onde já foi feito"
      description: "Cidades, estados ou países que já usam algo parecido, com resultados e links."
  - type: textarea
    id: comprovacao
    attributes:
      label: "Comprovação científica"
      description: "Estudos que mostram que a solução funciona. Se não houver, deixe em branco e preencha o campo seguinte."
  - type: textarea
    id: teste
    attributes:
      label: "Como testar a proposta"
      description: "Projeto piloto: onde, por quanto tempo, comparado com quê e qual resultado decide se continua."
  - type: textarea
    id: impacto
    attributes:
      label: "Impacto esperado"
  - type: textarea
    id: medir
    attributes:
      label: "Como medir"
      description: "Indicador e meta, com número e prazo."
  - type: textarea
    id: sol_cidadaos
    attributes:
      label: "Impacto positivo na vida dos cidadãos"
  - type: textarea
    id: sol_economia
    attributes:
      label: "Impacto na economia"
  - type: textarea
    id: sol_outras
    attributes:
      label: "Impacto em outras áreas"
  - type: textarea
    id: custo
    attributes:
      label: "Custo estimado e fonte dos recursos"
      description: "Medidas com custo e sem fonte não são aprovadas."
  - type: textarea
    id: pros
    attributes:
      label: "Prós"
      description: "Um por linha."
  - type: textarea
    id: contras
    attributes:
      label: "Contras"
      description: "Riscos, custos, resistências e quem perde. Um por linha."
